 d:r=>{if(S.found.includes(id))return;R(r[0]+2,r[1]+8,6,2,'rgba(0,0,0,.25)');R(r[0]+2,r[1]+2,6,6,'#fd0');R(r[0]+3,r[1]+3,4,4,'#fa0');if(Math.floor(tick*3)%4==0)R(r[0]+7,r[1],2,2,'#fff')}});

 d:r=>{R(r[0],r[1]+2,r[2],r[3]-2,'#6aa7e0');R(r[0]+3,r[1],r[2]-6,2,'#6aa7e0');R(r[0]+4+((tick*8)|0)%12,r[1]+4,4,1,'#cfe9ff')}});

const pondD=r=>{R(r[0]-3,r[1]-3,r[2]+6,r[3]+6,'#8c8c8c');R(r[0],r[1],r[2],r[3],'#3a86d0');R(r[0],r[1],r[2],5,'#5aa2e6');
 for(let i=0;i<4;i++)R(r[0]+8+((tick*6+i*25)%80),r[1]+12+i*9,10,2,'#9fd0ff');
 R(r[0]+70,r[1]+30,10,6,'#3a9a4a');R(r[0]+74,r[1]+28,3,3,'#f8a');R(r[0]+10,r[1]+34,9,5,'#3a9a4a');
 const dx=(tick*10)%90;R(r[0]+4+dx,r[1]+20,9,5,'#fff');R(r[0]+11+dx,r[1]+18,4,4,'#fff');R(r[0]+14+dx,r[1]+19,3,2,'#f90')};
function enterStation(){
 if(S.min>=1200)return say(['* Двери участка заперты. На часах '+fmt()+'.','* Участок закрылся в 20:00. День потерян.'],nextDay);
 setScene('station',160,190);
 if(!S.vis){S.vis=1;say(['* Вот и избирательный участок.','* Подойди к столу комиссии.'])}}
function exitAct(){
 if(S.ballot)return say(['* Охранник преграждает путь.','"Бюллетень уже выдан. Выйти можно только после голосования."']);
 ask('* Выйти из здания?',['Выйти','Остаться'],i=>{if(i==0){setScene('front',162,132);addT(2)}})}
function guardAct(){say(S.ballot?['"Бюллетень у вас на руках — выходить нельзя."','"Дойдите до кабинки и урны."']:['"Добро пожаловать. Выход вон там, если передумаете."'])}

 if(S.coins<1)return say('"Монеток нет? Приходи, когда найдёшь."');
 S.coins--;S.pie=1;addT(3);say(['* Пирожок куплен. Вкуснотища!','* Можно съесть (инвентарь: I) или кого-нибудь угостить. (+3 мин)'])})}
const MKTN={18:6,19:4,20:2};
const stall=(x,y,col,lab,act)=>({r:[x,y,50,22],s:1,act,d:r=>{R(r[0]-2,r[1]-14,r[2]+4,8,col);for(let i=0;i<5;i++)R(r[0]-2+i*11,r[1]-14,5,8,'#fff');R(r[0],r[1]-6,r[2],6,'rgba(0,0,0,.25)');R(r[0],r[1]+4,r[2],r[3]-4,'#a86a2a');T(lab,r[0]+25,r[1]+8,'#fff','center','bold 8px Arial,"Liberation Sans",sans-serif')}});
function musicAct(){[523,659,784,659,523,784].forEach((f,i)=>setTimeout(()=>blip(f,.18),i*220));say('* Уличный музыкант играет весёлую мелодию. Ноги сами притоптывают.')}
function backFromPark(){if(S.route==80)setScene('walk',292,135);else setScene('stop',292,125);addT(4)}
function pickParty(i){if(crossed(i)){blip(180,.2);return toast('Эта партия вычеркнута из бюллетеня!','#f66')}
 ask('* Отдать голос за «'+PARTIES[i]+'»?',['Да','Выбрать другую'],j=>{
  if(j==0){B=null;S.party=i;S.stage=4;say(['* Галочка поставлена. Никто не видел.','* Теперь опусти бюллетень в урну.'])}else mode='ballot'})}
let S,mode='title',scene='bed',P={x:160,y:150,d:'d',mv:0},dlg=null,keys={},bus=null,fade=null,q=null,E=null,tick=0;
const sc=()=>SC[scene];
const fmt=()=>pad(Math.floor(S.min/60)%24)+':'+pad(Math.floor(S.min%60));
const addT=m=>{S.min+=m};
function newGame(){S={day:18,min:480,pass:0,teeth:0,wash:0,eat:0,cat:0,plant:0,done:0,busI:0,stage:0,party:-1,coat:0,wet:0,feed:0,fact:0,hint:0,ballot:0,vis:0,route:0,found:[],coins:0,phone:0,flyer:0,pie:0,badge:0}}

function setScene(n,x,y){scene=n;P.x=x;P.y=y}
function say(l,cb){dlg={l:[].concat(l),i:0,n:0,cb,ch:null,sel:0};mode='dlg'}
function ask(t,o,cb){dlg={l:[t],i:0,n:0,cb,ch:o,sel:0};mode='dlg'}
function go(t,fn){fade={t:0,text:t,fn};mode='fade'}

/* ---------- ввод ---------- */
addEventListener('keydown',e=>{initAudio();if(e.code==='KeyM')mute=!mute;if(!keys[e.code])press(e.code);keys[e.code]=1;if(/Arrow|Space|Tab/.test(e.code))e.preventDefault()});
addEventListener('blur',()=>{keys={};tp=null;held=false});
addEventListener('keyup',e=>keys[e.code]=0);
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(_){}}if(AC&&AC.state==='suspended')AC.resume()}
function blip(f=520,d=.04){if(!AC||mute)return;try{const o=AC.createOscillator(),v=AC.createGain();o.type='square';o.frequency.value=f;v.gain.value=.03;o.connect(v);v.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(_){}}
const cpos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*320,(e.clientY-r.top)/r.height*240]};
function padMove(x,y){const vx=x-45,vy=y-195,l=Math.hypot(vx,vy);tp.dx=l<6?0:vx/l;tp.dy=l<6?0:vy/l}
cv.addEventListener('pointerdown',e=>{
 touch=touch||e.pointerType!=='mouse';initAudio();held=true;
 const[x,y]=cpos(e);
 if(mode==='play'&&x>236&&x<260&&y<18){openInv();return}if(mode==='inv'){invTap(x,y);return}
 if(mode==='play'&&touch){
  if(x<110&&y>130){tp={id:e.pointerId,dx:0,dy:0};padMove(x,y);try{cv.setPointerCapture(e.pointerId)}catch(_){}}
  else if(x>230&&y>150)press('KeyE');
  return}
 if(mode==='dlg'&&dlg&&dlg.ch&&dlg.n>=dlg.l[dlg.i].length){const i=Math.floor((y-184)/12);
  if(i>=0&&i<dlg.ch.length){if(dlg.sel===i)press('KeyE');else dlg.sel=i;return}}
 if(mode==='ballot'){if(x>235&&y>205){B=null;mode='play';return}const i=Math.floor((y-48)/22);
  if(i>=0&&i<PARTIES.length){if(B.sel===i)pickParty(i);else B.sel=i}return}
 press('KeyE')});
cv.addEventListener('pointermove',e=>{if(tp&&e.pointerId===tp.id){const[x,y]=cpos(e);padMove(x,y)}});
const upd=e=>{held=false;if(tp&&e.pointerId===tp.id)tp=null};
cv.addEventListener('pointerup',upd);cv.addEventListener('pointercancel',upd);
function press(k){
 const ok=OK.includes(k);
 if(mode==='play'&&S&&(k==='KeyI'||k==='Tab')){openInv();return}
 if(mode==='inv'){invKey(k);return}
 if(mode==='title'&&ok)return startGame();
 if(mode==='end'&&ok){mode='title';return}
 if(mode==='dlg'){const d=dlg,len=d.l[d.i].length;
  if(d.ch&&d.n>=len){
   if(['ArrowUp','KeyW','ArrowLeft','KeyA'].includes(k))d.sel=(d.sel+d.ch.length-1)%d.ch.length;
   if(['ArrowDown','KeyS','ArrowRight','KeyD'].includes(k))d.sel=(d.sel+1)%d.ch.length}
  if(ok){if(d.n<len)d.n=len;
   else if(d.ch||d.i+1>=d.l.length){dlg=null;mode='play';d.cb&&d.cb(d.sel)}
   else{d.i++;d.n=0}}
  return}
 if(mode==='ballot'){const n=PARTIES.length;
  if(['ArrowUp','KeyW','ArrowLeft','KeyA'].includes(k))B.sel=(B.sel+n-1)%n;
  if(['ArrowDown','KeyS','ArrowRight','KeyD'].includes(k))B.sel=(B.sel+1)%n;
  if(ok)pickParty(B.sel);
  if(k==='KeyX'||k==='Escape'){B=null;mode='play'}
  return}
 if(mode==='play'&&ok){const t=near();t&&t.act&&t.act()}
}
function near(){const a=[P.x-10,P.y-10,20,16];return sc().things.find(t=>t.act&&!(t.hide&&t.hide())&&hit(a,t.r))}

/* ---------- сюжет ---------- */
function startGame(){newGame();bus=null;go('18 сентября 2026\nПятница',()=>{setScene('bed',160,150);
 say(['* Ты просыпаешься.','* На часах 08:00. Сегодня 18 сентября 2026.','* Сегодня выборы. Идти или остаться в постели?'])})}
let RD=null,inv=null;
const IT=[['pass','Паспорт','Главный документ дня. Без него бюллетень не выдадут.'],['phone','Телефон','Сообщения от мамы и друга. Заряд 80%.'],['coat','Одежда','Защита от погоды.'],['coins','Монеты','Найдены на улицах. Хватит на пирожок.'],['pie','Пирожок','С капустой. Можно съесть (E) или угостить кого-нибудь.'],['flyer','Листовка','«Голосуй! 18, 19 и 20 сентября. Не забудь паспорт.»'],['ballot','Бюллетень','Пока пустой. Заполнить нужно в кабинке.'],['badge','Значок','Подарок бабушки с остановки: «Я голосую!»']];
function icon(id,x,y){
 if(id=='pass'){R(x+3,y+1,10,14,'#a22');R(x+6,y+5,4,4,'#fd0')}
 if(id=='phone'){R(x+4,y+1,8,14,'#444');R(x+5,y+3,6,9,'#6cf')}
 if(id=='coat'){R(x+2,y+3,12,11,S.coat==1?'#fd0':'#3a7bd5');R(x+6,y+1,4,3,'#fff')}
 if(id=='coins'){R(x+2,y+4,10,10,'#fd0');R(x+4,y+6,6,6,'#fa0');R(x+8,y+1,6,6,'#fd0')}
 if(id=='pie'){R(x+2,y+6,12,7,'#d9a050');R(x+3,y+4,10,3,'#e8b86a')}
 if(id=='flyer'||id=='ballot'){R(x+3,y+1,10,14,'#fff');for(let k=0;k<3;k++)R(x+5,y+4+k*4,6,2,id=='flyer'?'#2a4a9a':'#999')}
 if(id=='badge'){R(x+6,y+2,4,12,'#2a6ad5');R(x+2,y+6,12,4,'#2a6ad5');R(x+6,y+6,4,4,'#fd0')}}
function openInv(){inv={sel:0};mode='inv'}
function useItem(){const id=IT[inv.sel][0];if(!S[id])return;
 if(id=='pie'){S.pie=0;mode='play';toast('Пирожок съеден. Вкусно!')}
 else if(id=='phone'){mode='play';say(SMS[S.day])}
 else toast('Это нельзя использовать','#aaa')}
function invKey(k){const n=IT.length;
 if(['KeyI','Escape','KeyX','Tab'].includes(k)){mode='play';return}
 if(k=='ArrowLeft'||k=='KeyA')inv.sel=(inv.sel+n-1)%n;
 if(k=='ArrowRight'||k=='KeyD')inv.sel=(inv.sel+1)%n;
 if(k=='ArrowUp'||k=='KeyW')inv.sel=(inv.sel+4)%n;
 if(k=='ArrowDown'||k=='KeyS')inv.sel=(inv.sel+4)%n;
 if(OK.includes(k))useItem()}
function invTap(x,y){if(x<36||x>284||y<20||y>218){mode='play';return}
 const c=Math.floor((x-50)/58),r=Math.floor((y-52)/50);
 if(c>=0&&c<4&&r>=0&&r<2){const i=r*4+c;if(inv.sel==i)useItem();else inv.sel=i}}
function drawInv(){R(0,0,320,240,'rgba(0,0,0,.6)');R(36,20,248,200,'#fff');R(39,23,242,194,'#000');
 T('ИНВЕНТАРЬ',160,28,'#fff','center','bold 12px Arial,"Liberation Sans",sans-serif');
 IT.forEach((it,i)=>{const x=50+(i%4)*58,y=52+Math.floor(i/4)*50,own=S[it[0]];
  R(x,y,50,42,i==inv.sel?'#ff0':'#555');R(x+2,y+2,46,38,'#111');
  if(own)icon(it[0],x+17,y+6);else T('?',x+25,y+8,'#444','center','bold 16px Arial,"Liberation Sans",sans-serif');
  T(own?(it[0]=='coins'?'Монет: '+S.coins:it[1]):'???',x+25,y+28,own?'#fff':'#555','center','bold 8px Arial,"Liberation Sans",sans-serif')});
 const it=IT[inv.sel],d=S[it[0]]?(it[0]=='coat'?(S.coat==1?'Дождевик. Незаменим в дождь.':'Лёгкая куртка. Для пасмурных дней.'):it[2]):'Пока не найдено. Ищи по сторонам!';
 R(50,158,220,40,'#222');wrap(d,40).slice(0,3).forEach((l,i)=>T(l,56,162+i*11,'#fff','left','bold 8px Arial,"Liberation Sans",sans-serif'));
 T('I / Esc — закрыть   E — использовать',160,204,'#aaa','center','bold 8px Arial,"Liberation Sans",sans-serif')}
function ride(n,fn){bus=null;RD={t:0,n,fn};mode='ride'}
function midnight(){say(['* Часы бьют 00:00.','* Наступила полночь. День закончился.'],nextDay)}
function nextDay(){
 if(S.day>=20){go('Наступила ночь...',()=>{mode='end';E={type:'bad'}});return}
 S.day++;resetDay();bus=null;
